prSections:
  - title: Mine
    filters: is:open author:@me repo:juanibiapina/ghtui updated:>={{ nowModify "-3w" }} sort:updated-desc
    layout:
      author:
        hidden: true
      repoName:
        hidden: true
  - title: Review
    filters: repo:juanibiapina/ghtui -author:@me is:open updated:>={{ nowModify "-2.5w" }}
    layout:
      repoName:
        hidden: true
  - title: All
    filters: repo:juanibiapina/ghtui
issuesSections:
  - title: Open
    filters: repo:juanibiapina/ghtui is:open sort:reactions
  - title: Bugs
    filters: repo:juanibiapina/ghtui is:open sort:reactions label:bug
  - title: Features
    filters: repo:juanibiapina/ghtui is:open sort:reactions label:enhancement
  - title: All
    filters: repo:juanibiapina/ghtui sort:reactions

defaults:
  view: prs
  refetchIntervalMinutes: 5
  layout:
    prs:
      repoName:
        hidden: true
      base:
        hidden: true

  preview:
    open: true
  prsLimit: 20
  issuesLimit: 20
