# https://taskfile.dev

version: "3"
silent: true

tasks:
  logs:
    desc: Tail the debug logs
    cmds:
      - rm -f ./debug.log
      - touch ./debug.log
      - tail -f ./debug.log
    interactive: true

  docs-prepare:
    cmds:
      - cd docs && pnpm i

  docs:
    cmds:
      - cd docs && pnpm dev {{.CLI_ARGS}}
    desc: Start docs server

  docs-build:
    desc: Run docs production build
    cmds:
      - task: docs-prepare
      - cd docs && pnpm build

  docs-preview:
    desc: Preview docs production build
    cmds:
      - task: docs-build
      - cd docs && pnpm preview
