[package]
name = "ghtui"
version = "0.1.0"
edition = "2024"
description = "A rich terminal UI for GitHub that doesn't break your flow"
authors = ["Juan Ibiapina <juanibiapina@gmail.com>"]
license = "MIT"
repository = "https://github.com/juanibiapina/ghtui"
homepage = "https://juanm.dev/ghtui/"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
emojis = "0.9.1"
fancy-regex = "0.20.0"
pulldown-cmark = "0.13.6"
quick-xml = "0.42.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
unicode-width = "0.2.3"
ureq = { version = "3.5.1", features = ["json"] }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[package.metadata.dist]
dist = true

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
