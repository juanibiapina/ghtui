[package]
name = "gh-dash"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
emojis = "0.9.1"
fancy-regex = "0.20.0"
pulldown-cmark = "0.13.6"
quick-xml = "0.42.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
unicode-width = "0.2.3"
ureq = { version = "3.5.1", features = ["json"] }
