prSections:
  - title: My Pull Requests
    filters: is:open is:public author:@me
  - title: Ratatui
    filters: is:open repo:ratatui/ratatui
  - title: GitHub CLI
    filters: is:open repo:cli/cli
issuesSections:
  - title: Ratatui
    filters: is:open repo:ratatui/ratatui
  - title: GitHub CLI
    filters: is:open repo:cli/cli

defaults:
  preview:
    open: true
    width: 50
  prsLimit: 20
  issuesLimit: 20
  view: prs
keybindings:
  prs: []
repoPaths: {}
theme:
  colors:
    text:
      primary: "#89b4fa"
      secondary: "#b4befe"
      inverted: "#181825"
      faint: "#7f849c"
      warning: "#f9e2af"
      success: "#a6e3a1"
    background:
      selected: "#313244"
    border:
      primary: "#9399b2"
      secondary: "#585b70"
      faint: "#313244"
smartFilteringAtLaunch: false
