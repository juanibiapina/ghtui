prSections:
  - title: My Pull Requests
    filters: is:open is:public author:@me
  - title: Ratatui
    filters: is:open repo:ratatui/ratatui
  - title: GitHub CLI
    filters: is:open repo:cli/cli
issuesSections:
  - title: Ratatui
    filters: is:open repo:ratatui/ratatui
  - title: GitHub CLI
    filters: is:open repo:cli/cli

defaults:
  preview:
    open: true
    width: 50
  prsLimit: 20
  issuesLimit: 20
  view: prs
keybindings:
  prs: []
repoPaths: {}
theme:
  colors:
    text:
      primary: "#fe8019"
      secondary: "#d65d0e"
      inverted: "#3c3836"
      faint: "#d5c4a1"
      warning: "#fabd2f"
      success: "#98971a"
    background:
      selected: "#282828"
    border:
      primary: "#665c54"
      secondary: "#3c3836"
      faint: "#1d2021"
smartFilteringAtLaunch: false
